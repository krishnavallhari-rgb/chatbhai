kind = "web"
previewPath = "/"
title = "Social Chat Platform"
version = "1.0.0"
id = "artifacts/social-chat"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22286

[services.development]
run = "pnpm --filter @workspace/social-chat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/social-chat", "run", "build" ]
serve = "static"
publicDir = "artifacts/social-chat/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22286"
BASE_PATH = "/"
